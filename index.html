<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё синее приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg-color: var(--tg-theme-bg-color, #1a1f2e);
        --card-bg: var(--tg-theme-secondary-bg-color, #2b3448);
        --primary: var(--tg-theme-button-color, #3b82f6);
        --text: var(--tg-theme-text-color, #ffffff);
      }
      body {
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        background: var(--card-bg);
        padding: 16px;
        border-radius: 12px;
        margin: 12px;
      }
      h1 { margin: 0 0 10px; }
      button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        box-sizing: border-box;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Привет!</h1>
      <p>Это твоё синее мини‑приложение в Telegram.</p>
      <button onclick="sendData()">Нажми меня</button>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      function sendData() {
        tg.sendData('Пользователь нажал кнопку!');
        // Если это не бот с правами, sendData может просто закрыть приложение — это нормально.
      }
    </script>
  </body>
</html>
